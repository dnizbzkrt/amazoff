<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>amazoff - Ürün Detayı</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="home.html" class="logo-block">
      <span class="logo">amazoff</span>
      <span class="logo-slogan">everything you don't actually need</span>
    </a>
    <nav class="categories">
      <a href="home.html">Ürünler</a>
      <a href="home.html?category=Kozmetik">Kozmetik</a>
      <a href="home.html?category=Kadın+Giyim">Kadın Giyim</a>
      <a href="orders.html">Siparişlerim</a>
      <a href="feed.html">Tüm Siparişler</a>
    </nav>
    <div class="header-actions">
      <span class="wallet-pill" id="walletDisplay">Cüzdan: -</span>
      <a href="settings.html" class="icon-btn icon-btn-ghost">Ayarlar</a>
      <a href="cart.html" class="icon-btn">
        Sepet
        <span class="cart-badge" id="cartBadge">0</span>
      </a>
      <a href="#" class="logout-link" onclick="logout(); return false;">Çıkış</a>
    </div>
  </div>
</header>

<main class="container" id="detailContainer">
  <!-- filled by JS -->
</main>

<footer class="site-footer">
  <div class="foot-slogan">everything you don't actually need.</div>
  amazoff — demo e-ticaret projesi. Gerçek ödeme alınmaz.
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="products.js"></script>
<script src="cart.js"></script>
<script>
  let currentQty = 1;
  let currentProduct = null;

  function renderQty() {
    document.getElementById("qtyValue").textContent = currentQty;
  }

  function changeQty(delta) {
    const next = currentQty + delta;
    if (next >= 1 && next <= currentProduct.stock) {
      currentQty = next;
      renderQty();
    }
  }

  (async () => {
    const user = await requireAuth();
    if (!user) return;

    renderWalletBalance(user.id);
    updateCartBadge();

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    currentProduct = getProductById(id);
    const container = document.getElementById("detailContainer");

    if (!currentProduct) {
      container.innerHTML = `<p style="padding:60px 0;text-align:center;color:#767676;">Ürün bulunamadı. <a href="home.html" style="color:#ff6b1a;font-weight:700;">Ürünlere dön</a></p>`;
      return;
    }

    const p = currentProduct;
    container.innerHTML = `
      <div class="product-detail">
        <div class="detail-img">
          <img src="${p.image}" alt="${p.name}">
        </div>
        <div>
          <span class="detail-category">${p.category}</span>
          <h1 class="detail-title">${p.name}</h1>
          <p class="detail-desc">${p.description}</p>
          <p class="detail-price">${formatTL(p.price)}</p>
          <p class="detail-stock">Stok: ${p.stock} adet</p>

          <div class="qty-selector">
            <button onclick="changeQty(-1)">−</button>
            <span id="qtyValue">1</span>
            <button onclick="changeQty(1)">+</button>
          </div>

          <div class="detail-buttons">
            <button class="btn-primary" onclick="addToCart(${p.id}, currentQty); this.textContent='Sepete Eklendi ✓';">Sepete Ekle</button>
            <button class="btn-outline-brand" onclick="addToCart(${p.id}, currentQty); window.location.href='cart.html';">Hemen Al</button>
          </div>
        </div>
      </div>
    `;
  })();
</script>

</body>
</html>
