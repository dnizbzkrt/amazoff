<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>amazoff - Ürün Detayı</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="home.html" class="logo-block">
      <span class="logo">amazoff</span>
      <span class="logo-slogan">everything you don't actually need</span>
    </a>
    <div class="category-menu-wrap">
      <button class="category-menu-trigger" onclick="toggleCategoryMenu(event)" data-i18n-en="All Categories ▾">Tüm Kategoriler ▾</button>
      <div class="category-menu-panel" id="categoryMenuPanel"></div>
    </div>
    <form class="search-form" onsubmit="return handleSearch(event)">
      <input type="text" id="searchInput" placeholder="Ürün, kategori ara..." data-i18n-en-placeholder="Search products, categories...">
      <button type="submit">🔍</button>
    </form>
    <nav class="categories">
      <a href="orders.html" data-i18n-en="My Orders">Siparişlerim</a>
      <a href="feed.html" data-i18n-en="All Orders">Tüm Siparişler</a>
      <a href="istatistikler.html" data-i18n-en="Stats">İstatistikler</a>
      <a href="blog.html" data-i18n-en="Blog">Blog</a>
    </nav>
    <div class="header-actions">
      <div class="lang-switch" id="langSwitch"></div>
      <span class="wallet-pill" id="walletDisplay">Cüzdan: -</span>
      <a href="settings.html" class="icon-btn icon-btn-ghost" data-i18n-en="Settings">Ayarlar</a>
      <a href="cart.html" class="icon-btn">
        <span data-i18n-en="Cart">Sepet</span>
        <span class="cart-badge" id="cartBadge">0</span>
      </a>
      <a href="#" class="logout-link" onclick="logout(); return false;" data-i18n-en="Log Out">Çıkış</a>
    </div>
  </div>
</header>

<main class="container" id="detailContainer">
  <!-- filled by JS -->
</main>

<footer class="site-footer">
  <div class="foot-slogan" data-i18n-en="everything you don't actually need.">everything you don't actually need.</div>
  <div class="footer-links">
    <a href="about.html" data-i18n-en="About">Hakkımızda</a>
    <a href="blog.html" data-i18n-en="Blog">Blog</a>
    <a href="istatistikler.html" data-i18n-en="Stats">İstatistikler</a>
    <a href="privacy.html" data-i18n-en="Privacy Policy">Gizlilik Politikası</a>
    <a href="terms.html" data-i18n-en="Terms of Use">Kullanım Koşulları</a>
    <a href="contact.html" data-i18n-en="Contact">İletişim</a>
  </div>
  <span data-i18n-en="amazoff — a demo shopping project. No real payments are taken.">amazoff — demo e-ticaret projesi. Gerçek ödeme alınmaz.</span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="i18n.js"></script>
<script src="products.js"></script>
<script src="site-ui.js"></script>
<script src="cart.js"></script>
<script>
  let currentQty = 1;
  let currentProduct = null;

  function renderQty() {
    document.getElementById("qtyValue").textContent = currentQty;
  }

  function changeQty(delta) {
    const next = currentQty + delta;
    if (next >= 1 && next <= currentProduct.stock) {
      currentQty = next;
      renderQty();
    }
  }

  async function handleAddToCart(id, btn) {
    await addToCart(id, currentQty);
    btn.textContent = tt("Sepete Eklendi ✓", "Added to Cart ✓");
  }

  async function handleBuyNow(id) {
    await addToCart(id, currentQty);
    window.location.href = "cart.html";
  }

  (async () => {
    const user = await requireAuth();
    if (!user) return;

    await initLangSwitch(user.id);
    renderWalletBalance(user.id);
    await loadProducts();
    renderCategoryMenu();
    updateCartBadge();

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    currentProduct = getProductById(id);
    const container = document.getElementById("detailContainer");

    if (!currentProduct) {
      container.innerHTML = `<p style="padding:60px 0;text-align:center;color:#767676;">${tt("Ürün bulunamadı.", "Product not found.")} <a href="home.html" style="color:var(--accent);font-weight:700;">${tt("Ürünlere dön", "Back to products")}</a></p>`;
      return;
    }

    const p = currentProduct;
    container.innerHTML = `
      <div class="product-detail">
        <div class="detail-img">
          <img src="${p.image}" alt="${productName(p)}">
        </div>
        <div>
          <span class="detail-category">${productCategory(p)}</span>
          <h1 class="detail-title">${productName(p)}</h1>
          <p class="detail-desc">${productDescription(p)}</p>
          <p class="detail-price">${formatTL(p.price)}</p>
          <p class="detail-stock">${tt("Stok", "Stock")}: ${p.stock} ${tt("adet", "left")}</p>

          <div class="qty-selector">
            <button onclick="changeQty(-1)">−</button>
            <span id="qtyValue">1</span>
            <button onclick="changeQty(1)">+</button>
          </div>

          <div class="detail-buttons">
            <button class="btn-primary" onclick="handleAddToCart(${p.id}, this)">${tt("Sepete Ekle", "Add to Cart")}</button>
            <button class="btn-outline-brand" onclick="handleBuyNow(${p.id})">${tt("Hemen Al", "Buy Now")}</button>
          </div>
        </div>
      </div>
    `;
  })();
</script>

</body>
</html>
