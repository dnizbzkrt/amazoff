<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>amazoff - Giriş Yap</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-wrap">
  <div class="lang-switch lang-switch-floating" id="langSwitch"></div>
  <div class="login-card">
    <h1>amazoff</h1>
    <p class="sub" data-i18n-en="everything you don't actually need.">everything you don't actually need.</p>

    <div id="msgBox"></div>

    <form id="loginForm">
      <div class="form-row">
        <label data-i18n-en="Email">E-posta</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="form-row">
        <label data-i18n-en="Password">Şifre</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-full" data-i18n-en="Log In">Giriş Yap</button>
    </form>

    <p class="form-footer">
      <span data-i18n-en="Don't have an account?">Hesabınız yok mu?</span> <a href="register.html" data-i18n-en="Sign Up">Kayıt Ol</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="i18n.js"></script>
<script>
  redirectIfLoggedIn();
  renderLangSwitchLocal();

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const msgBox = document.getElementById("msgBox");
    msgBox.innerHTML = "";

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      msgBox.innerHTML = `<div class="msg error">${tt("Giriş başarısız: E-posta veya şifre hatalı.", "Login failed: incorrect email or password.")}</div>`;
    } else {
      window.location.href = "home.html";
    }
  });
</script>

</body>
</html>
