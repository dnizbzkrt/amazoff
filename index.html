<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>amazoff - Giriş Yap</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <h1>amazoff</h1>
    <p class="sub">Kozmetik &amp; Kadın Giyim</p>

    <div id="msgBox"></div>

    <form id="loginForm">
      <div class="form-row">
        <label>E-posta</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="form-row">
        <label>Şifre</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-full">Giriş Yap</button>
    </form>

    <p class="form-footer">
      Hesabınız yok mu? <a href="register.html">Kayıt Ol</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  redirectIfLoggedIn();

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const msgBox = document.getElementById("msgBox");
    msgBox.innerHTML = "";

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      msgBox.innerHTML = `<div class="msg error">Giriş başarısız: E-posta veya şifre hatalı.</div>`;
    } else {
      window.location.href = "home.html";
    }
  });
</script>

</body>
</html>
