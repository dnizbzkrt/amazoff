<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>amazoff - Kayıt Ol</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-wrap">
  <div class="lang-switch lang-switch-floating" id="langSwitch"></div>
  <div class="login-card">
    <h1>amazoff</h1>
    <p class="sub" data-i18n-en="Sign up to get 10,000 TL of demo wallet balance, automatically.">Kayıt olduğunuzda hesabınıza otomatik olarak <strong>10.000 TL</strong> demo cüzdan bakiyesi tanımlanır.</p>

    <div id="msgBox"></div>

    <form id="registerForm">
      <div class="form-row">
        <label data-i18n-en="Email">E-posta</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="form-row">
        <label data-i18n-en="Password">Şifre</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn-full" data-i18n-en="Sign Up">Kayıt Ol</button>
    </form>

    <p class="form-footer">
      <span data-i18n-en="Already have an account?">Zaten hesabınız var mı?</span> <a href="index.html" data-i18n-en="Log In">Giriş Yap</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="i18n.js"></script>
<script>
  redirectIfLoggedIn();
  renderLangSwitchLocal();

  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const msgBox = document.getElementById("msgBox");
    msgBox.innerHTML = "";

    const { data, error } = await supabaseClient.auth.signUp({ email, password });

    if (error) {
      msgBox.innerHTML = `<div class="msg error">${tt("Kayıt başarısız:", "Sign-up failed:")} ${error.message}</div>`;
      return;
    }

    if (data.session) {
      window.location.href = "home.html";
    } else {
      msgBox.innerHTML = `<div class="msg success">${tt("Kayıt başarılı! E-posta adresinize gelen doğrulama bağlantısına tıklayıp giriş yapabilirsiniz.", "Sign-up successful! Click the confirmation link sent to your email to log in.")}</div>`;
    }
  });
</script>

</body>
</html>
